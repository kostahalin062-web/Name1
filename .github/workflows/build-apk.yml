name: Собрать «Будильник на пары» (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  test:
    name: Тесты (логика + эмулятор Android 14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Тесты логики (расписание, подсказка, серии)
        run: gradle -p android --no-daemon testDebugUnitTest

      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Тесты на эмуляторе (будильник реально звонит)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            gradle -p android --no-daemon connectedDebugAndroidTest || (adb logcat -d -s BudilnikTest AndroidRuntime ActivityTaskManager > logcat.txt; adb pull /data/local/tmp/shots shots || true; exit 1)
            adb logcat -d -s BudilnikTest > logcat.txt || true
            adb pull /data/local/tmp/shots shots || true

      - name: Сохранить скриншоты и отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            shots/
            logcat.txt
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ключ подписи из секрета (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.BUDILNIK_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/budilnik.keystore"
            echo "BUDILNIK_KEYSTORE_FILE=$RUNNER_TEMP/budilnik.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет BUDILNIK_KEYSTORE не задан — APK подписан временным ключом, обновление может потребовать переустановки."
          fi

      - name: Собрать APK
        env:
          BUDILNIK_KEYSTORE_PASSWORD: ${{ secrets.BUDILNIK_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease

      - name: Подготовить файл
        run: cp android/app/build/outputs/apk/release/app-release.apk budilnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budilnik-apk
          path: budilnik.apk

      - name: Выложить в релиз «budilnik-latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: budilnik-latest
          name: Будильник на пары (последняя сборка)
          body: |
            Скачай `budilnik.apk` на телефон и установи (разреши установку из этого источника).
            Если в репозитории задан секрет BUDILNIK_KEYSTORE, новая сборка ставится поверх старой; иначе старую версию сначала удали.
            Сборка из коммита ${{ github.sha }}.
          files: budilnik.apk
          make_latest: false
