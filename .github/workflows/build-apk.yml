name: Собрать APK «До отпуска»

on:
  push:
    paths:
      - 'do-otpuska/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}        # кнопка «Run workflow» для ручного запуска

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: do-otpuska
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить Capacitor
        run: npm ci

      - name: Скопировать страницу в Android-проект
        run: npx cap sync android

      - name: Собрать APK
        working-directory: do-otpuska/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../do-otpuska.apk

      - name: Выложить APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: do-otpuska-apk
          path: do-otpuska/do-otpuska.apk
