01" xml:space="preserve">ул. Скоростная, 7</text></g><g id="Частые вопросы"><rect x="920" y="659" width="400" height="324" rx="16" fill="#111725"/><rect x="921" y="660" width="399" height="323" rx="16" fill="none" stroke="#263049" stroke-width="1"/><text font-family="Inter" font-size="18" fill="#eef1f8" x="945" y="703" xml:space="preserve">Частые вопросы</text><rect x="945" y="814" width="350" height="1" fill="#263049"/><text font-family="Inter" font-size="15" fill="#eef1f8" x="945" y="746" xml:space="preserve">Можно ли отменить бронь?</text><text font-family="Inter" font-size="14" fill="#a3acc2" x="945" y="772" xml:space="preserve">Да, бесплатно — не позднее чем за 1 час до</text><text font-family="Inter" font-size="14" fill="#a3acc2" x="945" y="793" xml:space="preserve">начала в личном кабинете.</text><rect x="945" y="894" width="350" height="1" fill="#263049"/><text font-family="Inter" font-size="15" fill="#eef1f8" x="945" y="847" xml:space="preserve">С какого возраста можно играть?</text><text font-family="Inter" font-size="14" fill="#a3acc2" x="945" y="873" xml:space="preserve">С 14 лет. Ночные пакеты — с 18 лет.</text><text font-family="Inter" font-size="15" fill="#eef1f8" x="945" y="927" xml:space="preserve">Как вернуть деньги с баланса?</text><text font-family="Inter" font-size="14" fill="#a3acc2" x="945" y="953" xml:space="preserve">Оставьте обращение с темой «Оплата и баланс».</text></g></g><g id="footer.footer"><rect x="0" y="1103" width="1440" height="329" fill="#080a10"/><rect x="0" y="1103" width="1440" height="1" fill="#263049"/><g id="a"><g id="@A:logo:fit:0"><rect x="120" y="1168" width="214" height="44" fill="#000" fill-opacity="0.01"/></g></g><text font-family="Inter" font-size="14" fill="#a3acc2" x="120" y="1244" xml:space="preserve">Компьютерный клуб с мощным железом,</text><text font-family="Inter" font-size="14" fill="#a3acc2" x="120" y="1266" xml:space="preserve">VIP-залом и турнирами каждую неделю.</text><text font-family="Inter" font-size="